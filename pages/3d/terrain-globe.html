<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Globe</title><style>*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef2ff;font:16px system-ui;max-width:1000px;margin:auto;padding:18px}a{color:#c4b5fd}button,select,input{font:inherit;background:#202d47;color:#eef2ff;border:1px solid #526080;border-radius:7px;padding:8px}canvas{background:#080c16;border-radius:12px;margin:14px 0}</style></head><body><a href="../mega-lab.html">← experiment lab</a><h1>3D Globe</h1><p>Rotate a shaded globe with procedural continents.</p><script>let yaw=0,pitch=.2,drag=false,lastX=0,lastY=0;document.body.insertAdjacentHTML('beforeend','<canvas style="width:100%;height:65vh;display:block;touch-action:none"></canvas><p>Drag to rotate the planet.</p>');let c=document.querySelector('canvas'),x=c.getContext('2d');c.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointerup=()=>drag=false;c.onpointermove=e=>{if(drag){yaw+=(e.clientX-lastX)*.008;pitch+=(e.clientY-lastY)*.008;lastX=e.clientX;lastY=e.clientY}};function render(){let w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w=c.clientWidth;h=c.clientHeight;x.fillStyle='#030712';x.fillRect(0,0,w,h);let r=Math.min(w,h)*.34,cx=w/2,cy=h/2;let g=x.createRadialGradient(cx-r*.3,cy-r*.4,r*.1,cx,cy,r);g.addColorStop(0,'#5eead4');g.addColorStop(.65,'#2563eb');g.addColorStop(1,'#101b47');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.clip();for(let i=0;i<170;i++){let lat=Math.sin(i*12.989)*1.2,lon=i*2.399+yaw,xx=Math.cos(lat)*Math.sin(lon),zz=Math.cos(lat)*Math.cos(lon),yy=Math.sin(lat);if(zz<-.05)continue;let sx=cx+r*xx,sy=cy-r*(yy*Math.cos(pitch)+zz*Math.sin(pitch));x.fillStyle=i%3?'#22a06b':'#84cc16';x.beginPath();x.ellipse(sx,sy,5+Math.abs(Math.sin(i*8))*14,3+Math.abs(Math.cos(i))*8,lon,0,7);x.fill()}x.strokeStyle='rgba(190,230,255,.25)';for(let i=-2;i<=2;i++){x.beginPath();x.ellipse(cx,cy,r*Math.cos(i*.28),r*Math.sin(i*.28)||1,0,0,7);x.stroke()}x.restore();requestAnimationFrame(render)}render();</script></body></html>
