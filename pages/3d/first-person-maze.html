<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First-Person 3D Maze</title><style>*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef2ff;font:16px system-ui;max-width:1000px;margin:auto;padding:18px}a{color:#c4b5fd}button,select,input{font:inherit;background:#202d47;color:#eef2ff;border:1px solid #526080;border-radius:7px;padding:8px}canvas{background:#080c16;border-radius:12px;margin:14px 0}</style></head><body><a href="../mega-lab.html">← experiment lab</a><h1>First-Person 3D Maze</h1><p>Navigate a raycast 3D maze and find the exit.</p><script>const map=['111111111111','100000100001','101110101101','100010000001','111010111101','100000100001','101110101101','100000000001','111111111101','100000000001','111111111111'];let px=1.5,py=1.5,ang=0;document.body.insertAdjacentHTML('beforeend','<canvas style="width:100%;height:60vh;display:block"></canvas><p>W/S move, A/D turn. Find the glowing exit.</p><button onclick="px=1.5;py=1.5;ang=0">Restart</button>');let c=document.querySelector('canvas'),x=c.getContext('2d');onkeydown=e=>{if(e.key==='a'||e.key==='ArrowLeft')ang-=.12;if(e.key==='d'||e.key==='ArrowRight')ang+=.12;let nx=px,ny=py;if(e.key==='w'||e.key==='ArrowUp'){nx+=Math.cos(ang)*.2;ny+=Math.sin(ang)*.2}if(e.key==='s'||e.key==='ArrowDown'){nx-=Math.cos(ang)*.2;ny-=Math.sin(ang)*.2}if(map[Math.floor(ny)]?.[Math.floor(nx)]==='0'){px=nx;py=ny}};function render(){let w=c.width=c.clientWidth,h=c.height=c.clientHeight;x.fillStyle='#121b31';x.fillRect(0,0,w,h/2);x.fillStyle='#29233d';x.fillRect(0,h/2,w,h/2);for(let col=0;col<w;col+=2){let ra=ang+(col/w-.5)*1.1,dist=0,hit=false;while(dist<14&&!hit){dist+=.025;let xx=px+Math.cos(ra)*dist,yy=py+Math.sin(ra)*dist;if(map[Math.floor(yy)]?.[Math.floor(xx)]!=='0')hit=true}let corrected=dist*Math.cos(ra-ang),height=Math.min(h,h/(corrected+.01));let shade=Math.max(25,180-corrected*18);x.fillStyle='rgb('+Math.floor(shade*.55)+','+Math.floor(shade*.7)+','+shade+')';x.fillRect(col,(h-height)/2,2,height)}x.fillStyle='#facc15';x.fillRect(w*.48,h*.45,4,4);if(Math.floor(px)===10&&Math.floor(py)===9){x.fillStyle='white';x.font='24px system-ui';x.fillText('EXIT FOUND!',w/2-65,40)}requestAnimationFrame(render)}render();</script></body></html>
