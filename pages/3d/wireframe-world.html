<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wireframe World</title><style>*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef2ff;font:16px system-ui;max-width:1000px;margin:auto;padding:18px}a{color:#c4b5fd}button,select,input{font:inherit;background:#202d47;color:#eef2ff;border:1px solid #526080;border-radius:7px;padding:8px}canvas{background:#080c16;border-radius:12px;margin:14px 0}</style></head><body><a href="../mega-lab.html">← experiment lab</a><h1>Wireframe World</h1><p>Fly through a procedural 3D landscape.</p><script>let yaw=0,pitch=0,z=0;const keys={};onkeydown=e=>keys[e.key.toLowerCase()]=1;onkeyup=e=>keys[e.key.toLowerCase()]=0;function draw(){const c=document.querySelector('canvas'),x=c.getContext('2d'),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);let W=c.clientWidth,H=c.clientHeight;x.fillStyle='#050914';x.fillRect(0,0,W,H);let project=(X,Y,Z)=>{X-=Math.sin(yaw)*z;Z-=Math.cos(yaw)*z;let a=X*Math.cos(yaw)-Z*Math.sin(yaw),b=X*Math.sin(yaw)+Z*Math.cos(yaw),d=b+8;if(d<.2)return null;return [W/2+a*W/d,H/2-(Y*Math.cos(pitch)-d*Math.sin(pitch))*W/d]};for(let zz=-8;zz<35;zz+=1){x.strokeStyle='rgba(115,145,255,'+(zz%4===0?.45:.16)+')';x.beginPath();for(let xx=-18;xx<=18;xx+=.4){let yy=Math.sin(xx*.5+zz*.3)*.5+Math.cos(zz*.35+xx*.2)*.35,p=project(xx,yy,zz);if(p)xx===-18?x.moveTo(...p):x.lineTo(...p)}x.stroke()}for(let xx=-18;xx<=18;xx+=2){x.strokeStyle='#6f83c5';x.beginPath();for(let zz=-8;zz<35;zz+=.5){let p=project(xx,Math.sin(xx*.5+zz*.3)*.5,zz);if(p)zz===-8?x.moveTo(...p):x.lineTo(...p)}x.stroke()}if(keys.a||keys.arrowleft)yaw-=.025;if(keys.d||keys.arrowright)yaw+=.025;if(keys.w||keys.arrowup)z+=.12;if(keys.s||keys.arrowdown)z-=.12;requestAnimationFrame(draw)}document.body.insertAdjacentHTML('beforeend','<canvas style="width:100%;height:65vh;display:block;background:#050914"></canvas><p>WASD or arrows to fly through the terrain.</p>');draw();</script></body></html>
