<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rainy window</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>rainy window</h1><p>sit and watch fake rain. add lightning if you want</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='760' height='460'></canvas><div class='row'><button id='light'>lightning</button><label>rain <input id='amt' type='range' min='50' max='700' value='300'></label></div></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let drops=[],flash=0;document.querySelector('#light').onclick=()=>flash=10;function draw(){x.fillStyle=flash?'#b8c9e8':'#0a1526';x.fillRect(0,0,760,460);if(drops.length<Number(document.querySelector('#amt').value))drops.push({x:Math.random()*760,y:-10,v:4+Math.random()*8});x.strokeStyle=flash?'#fff':'#5f9bc9';x.lineWidth=1;drops.forEach(d=>{d.y+=d.v;x.beginPath();x.moveTo(d.x,d.y);x.lineTo(d.x-3,d.y+12);x.stroke()});drops=drops.filter(d=>d.y<470);if(flash)flash--;requestAnimationFrame(draw)}draw();</script></body></html>
