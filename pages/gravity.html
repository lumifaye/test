<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gravity sandbox</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>gravity sandbox</h1><p>drop balls and watch them bonk into each other</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='760' height='460'></canvas><div class='row'><button id='add'>add 10 balls</button><button id='reset'>reset</button></div><p>click anywhere to spawn a ball.</p></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let balls=[];function add(n=1,px=Math.random()*760,py=30){for(let i=0;i<n;i++)balls.push({x:px,y:py,vx:Math.random()*4-2,vy:Math.random()*-2,r:5+Math.random()*12,col:['#8b7cff','#7ce5d1','#ff9bb8','#ffd37b'][Math.random()*4|0]})}c.onclick=e=>add(1,e.offsetX/c.clientWidth*760,e.offsetY/c.clientHeight*460);document.querySelector('#add').onclick=()=>add(10);document.querySelector('#reset').onclick=()=>balls=[];function draw(){x.fillStyle='#0a1020';x.fillRect(0,0,760,460);balls.forEach(b=>{b.vy+=.13;b.x+=b.vx;b.y+=b.vy;if(b.y+b.r>460){b.y=460-b.r;b.vy*=-.8}if(b.x<b.r||b.x>760-b.r)b.vx*=-1;x.fillStyle=b.col;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()});requestAnimationFrame(draw)}add(15);draw();</script></body></html>
