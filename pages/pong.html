<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pong but by yourself</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>pong but by yourself</h1><p>bounce the ball past the computer</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='700' height='420'></canvas><p>move your mouse up and down. computer is trying its best.</p><div id='s'>you 0 · cpu 0</div></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let py=170,cy=170,bx=350,by=210,vx=4,vy=2,you=0,cpu=0;c.onpointermove=e=>py=e.offsetY/c.clientHeight*420-45;function draw(){x.fillStyle='#081020';x.fillRect(0,0,700,420);x.fillStyle='#9caee0';for(let y=0;y<420;y+=25)x.fillRect(347,y,6,12);cy+=(by-cy-45)*.04;by+=vy;bx+=vx;if(by<5||by>415)vy=-vy;if(bx<35&&by>py&&by<py+90)vx=Math.abs(vx)*1.04;if(bx>665&&by>cy&&by<cy+90)vx=-Math.abs(vx)*1.04;if(bx<0||bx>700){if(bx<0)cpu++;else you++;bx=350;by=210;vx=bx<0?4:-4}x.fillStyle='#9a8aff';x.fillRect(15,py,12,90);x.fillStyle='#ff9cbd';x.fillRect(673,cy,12,90);x.fillStyle='white';x.beginPath();x.arc(bx,by,8,0,7);x.fill();document.querySelector('#s').textContent='you '+you+' · cpu '+cpu;requestAnimationFrame(draw)}draw();</script></body></html>
