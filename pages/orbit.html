<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>orbit playground</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>orbit playground</h1><p>launch a rock and see if it escapes</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='760' height='460'></canvas><p>click to launch a rock from that spot. gravity pulls it toward the middle.</p><button id='clear'>clear rocks</button></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let rocks=[];c.onclick=e=>{let px=e.offsetX/c.clientWidth*760,py=e.offsetY/c.clientHeight*460;rocks.push({x:px,y:py,vx:(380-px)*.025+(Math.random()-.5)*2,vy:(230-py)*.025+(Math.random()-.5)*2,trail:[]})};document.querySelector('#clear').onclick=()=>rocks=[];function draw(){x.fillStyle='#080d1b';x.fillRect(0,0,760,460);x.fillStyle='#ffd980';x.beginPath();x.arc(380,230,22,0,7);x.fill();rocks.forEach(r=>{let dx=380-r.x,dy=230-r.y,d=Math.max(50,dx*dx+dy*dy),f=180/d;r.vx+=dx*f;r.vy+=dy*f;r.x+=r.vx;r.y+=r.vy;r.trail.push([r.x,r.y]);if(r.trail.length>45)r.trail.shift();x.strokeStyle='#8b7cff';x.beginPath();r.trail.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();x.fillStyle='#c7d2ff';x.beginPath();x.arc(r.x,r.y,4,0,7);x.fill()});requestAnimationFrame(draw)}draw();</script></body></html>
