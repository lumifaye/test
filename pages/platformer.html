<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tiny platformer</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>tiny platformer</h1><p>jump on stuff and try not to fall</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='760' height='420'></canvas><p>← → or A/D to move. Space to jump. collect the little coins.</p><div id='s'>coins: 0</div></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),k={};onkeydown=e=>{k[e.key.toLowerCase()]=true;if(e.code==='Space')e.preventDefault()};onkeyup=e=>k[e.key.toLowerCase()]=false;let px=60,py=300,vx=0,vy=0,coins=0;const plats=[[0,380,760,40],[120,310,120,14],[300,250,110,14],[470,190,130,14],[620,290,100,14]],coin=[[170,275],[340,215],[520,155],[660,255]];function draw(){vx=(k.arrowright||k.d?3:0)-(k.arrowleft||k.a?3:0);if((k[' ']||k.space)&&Math.abs(vy)<.01)vy=-10;vy+=.45;px+=vx;py+=vy;plats.forEach(([a,b,w,h])=>{if(px+18>a&&px<a+w&&py+22>=b&&py+22<=b+vy+4&&vy>0){py=b-22;vy=0}});if(py>460){px=60;py=300;vy=0}x.fillStyle='#10182b';x.fillRect(0,0,760,420);plats.forEach(([a,b,w,h])=>{x.fillStyle='#566f94';x.fillRect(a,b,w,h)});coin.forEach((q,i)=>{if(q[0]!==0&&Math.hypot(px-q[0],py-q[1])<24){q[0]=0;coins++}if(q[0]){x.fillStyle='#ffd66b';x.beginPath();x.arc(q[0],q[1],8,0,7);x.fill()}});x.fillStyle='#9b86ff';x.fillRect(px,py,20,22);document.querySelector('#s').textContent='coins: '+coins+' / 4';requestAnimationFrame(draw)}draw();</script></body></html>
