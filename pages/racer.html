<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tiny racer</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>tiny racer</h1><p>dodge the traffic for as long as possible</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='420' height='560'></canvas><p>move with A/D or ← →. don't get bonked.</p><div id='s'>score: 0</div><button onclick='location.reload()'>restart</button></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),k={};onkeydown=e=>k[e.key.toLowerCase()]=true;onkeyup=e=>k[e.key.toLowerCase()]=false;let px=200,obs=[],score=0,dead=false;function draw(){x.fillStyle='#222a36';x.fillRect(0,0,420,560);x.fillStyle='#d5d8dc';for(let y=-20;y<560;y+=80)x.fillRect(207,y+(score%80),6,40);if(!dead){if(k.a||k.arrowleft)px-=4;if(k.d||k.arrowright)px+=4;px=Math.max(90,Math.min(300,px));if(Math.random()<.025)obs.push({x:90+Math.random()*210,y:-50});obs.forEach(o=>o.y+=4);obs=obs.filter(o=>o.y<600);score++;if(obs.some(o=>Math.abs(o.x-px)<34&&Math.abs(o.y-460)<60))dead=true}obs.forEach(o=>{x.fillStyle='#ff617d';x.fillRect(o.x,o.y,32,54)});x.fillStyle='#7ce4ff';x.fillRect(px,460,30,54);document.querySelector('#s').textContent=dead?'bonked! score: '+score:'score: '+score;requestAnimationFrame(draw)}draw();</script></body></html>
