<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>brick bonker</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>brick bonker</h1><p>break the bricks with the ball</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='640' height='440'></canvas><p>move your mouse or finger to move the paddle.</p><div id='s'>bricks left: 30</div></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let px=280,bx=320,by=300,vx=3,vy=-3,br=[];for(let r=0;r<5;r++)for(let q=0;q<6;q++)br.push({x:20+q*101,y:30+r*25,on:true});c.onpointermove=e=>px=e.offsetX/c.clientWidth*640-50;function draw(){x.fillStyle='#090f20';x.fillRect(0,0,640,440);br.forEach(b=>{if(b.on){x.fillStyle=['#ff7b9c','#ffc66e','#83e4c5','#8ca8ff','#c5a0ff'][Math.floor(b.y/25/1)%5];x.fillRect(b.x,b.y,90,17);if(bx>b.x&&bx<b.x+90&&by>b.y&&by<b.y+17){b.on=false;vy=-vy}}});bx+=vx;by+=vy;if(bx<6||bx>634)vx=-vx;if(by<6)vy=-vy;if(by>400&&by<420&&bx>px&&bx<px+100)vy=-Math.abs(vy);if(by>445){bx=320;by=300;vy=-3}x.fillStyle='#eaf1ff';x.beginPath();x.arc(bx,by,7,0,7);x.fill();x.fillStyle='#8b7cff';x.fillRect(px,410,100,12);document.querySelector('#s').textContent='bricks left: '+br.filter(b=>b.on).length;requestAnimationFrame(draw)}draw();</script></body></html>
