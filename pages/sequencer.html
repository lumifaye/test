<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>beep grid</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>beep grid</h1><p>make a tiny tune by clicking boxes</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><div id='grid' style='display:grid;grid-template-columns:repeat(16,1fr);gap:4px'></div><div class='row' style='margin-top:14px'><button id='play'>play</button><button id='clear'>clear</button><label>tempo <input id='tempo' type='range' min='80' max='220' value='120'></label></div><p class='note'>turn on boxes and see what noise you accidentally invent.</p></section></main><script>const grid=document.querySelector('#grid');let on=Array.from({length:8},()=>Array(16).fill(false)),step=0,playing=false,timer;const cells=[];for(let r=0;r<8;r++)for(let c=0;c<16;c++){let b=document.createElement('button');b.style.padding='0';b.style.height='30px';b.style.background='#202b44';b.onclick=()=>{on[r][c]=!on[r][c];b.style.background=on[r][c]?'#8b7cff':'#202b44'};grid.append(b);cells.push(b)}function tick(){if(!playing)return;cells.forEach((b,i)=>b.style.outline=i%16===step?'2px solid #ffe38b':'none');for(let r=0;r<8;r++)if(on[r][step]){let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=220*Math.pow(2,(7-r)*.7);g.gain.value=.06;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.stop(a.currentTime+.13);o.onended=()=>a.close()}step=(step+1)%16;timer=setTimeout(tick,60000/Number(document.querySelector('#tempo').value)/2)}document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'stop':'play';if(playing)tick();else clearTimeout(timer)};document.querySelector('#clear').onclick=()=>{on=on.map(r=>r.map(()=>false));cells.forEach(b=>{b.style.background='#202b44';b.style.outline='none'})};</script></body></html>
