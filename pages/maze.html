<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>maze escape</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>maze escape</h1><p>find the exit in a maze that changes every time</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='500' height='500'></canvas><p>arrow keys or WASD. get to the green square.</p><button id='new'>new maze</button><span id='s'></span></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),N=25;let grid,px=0,py=0;function make(){grid=Array.from({length:N},()=>Array.from({length:N},()=>Math.random()>.28));grid[0][0]=grid[N-1][N-1]=true;let a=[[0,0]];while(a.length){let [u,v]=a.pop();grid[v][u]=true;[[u+1,v],[u-1,v],[u,v+1],[u,v-1]].forEach(([q,w])=>{if(q>=0&&w>=0&&q<N&&w<N&&!grid[w][q]){grid[w][q]=true;a.push([q,w])}})}px=py=0;draw()}onkeydown=e=>{let dx=0,dy=0;if(e.key==='ArrowUp'||e.key==='w')dy=-1;if(e.key==='ArrowDown'||e.key==='s')dy=1;if(e.key==='ArrowLeft'||e.key==='a')dx=-1;if(e.key==='ArrowRight'||e.key==='d')dx=1;if(grid?.[py+dy]?.[px+dx]){px+=dx;py+=dy;draw()}};function draw(){if(!grid)return;x.fillStyle='#0a1020';x.fillRect(0,0,500,500);let s=20;grid.forEach((r,y)=>r.forEach((v,z)=>{x.fillStyle=v?'#1e2b40':'#080b13';x.fillRect(z*s,y*s,s-1,s-1)}));x.fillStyle='#8b7cff';x.fillRect(px*s+3,py*s+3,14,14);x.fillStyle='#80e6b3';x.fillRect(24*s+3,24*s+3,14,14);document.querySelector('#s').textContent=px===24&&py===24?' you made it!':''}document.querySelector('#new').onclick=make;make();</script></body></html>
