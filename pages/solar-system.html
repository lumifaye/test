<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>space rocks</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>space rocks</h1><p>a tiny solar system. drag to rotate it</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='760' height='500'></canvas><p>drag to spin the whole thing. click to add a planet.</p></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let rot=0,down=false,last=0,planets=[{r:60,s:.02,c:'#8bdcff',size:7},{r:100,s:.012,c:'#f8b26a',size:11},{r:150,s:.008,c:'#a994ff',size:9},{r:205,s:.005,c:'#7ce0b3',size:14}];c.onpointerdown=e=>{down=true;last=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointerup=()=>down=false;c.onpointermove=e=>{if(down){rot+=(e.clientX-last)*.01;last=e.clientX}};c.onclick=e=>{if(planets.length<8)planets.push({r:240+planets.length*16,s:.003+Math.random()*.004,c:'#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'),size:5+Math.random()*8})};function draw(t){x.fillStyle='#060a17';x.fillRect(0,0,760,500);for(let i=0;i<150;i++){x.fillStyle='#ffffff55';x.fillRect((i*197)%760,(i*83)%500,1,1)}planets.forEach(p=>{x.strokeStyle='#53607c66';x.beginPath();x.ellipse(380,250,p.r,p.r*.48,0,0,7);x.stroke();let a=t*p.s+rot,px=380+Math.cos(a)*p.r,py=250+Math.sin(a)*p.r*.48;x.fillStyle=p.c;x.beginPath();x.arc(px,py,p.size,0,7);x.fill()});x.fillStyle='#ffe79a';x.shadowBlur=25;x.shadowColor='#ffcf70';x.beginPath();x.arc(380,250,23,0,7);x.fill();x.shadowBlur=0;requestAnimationFrame(draw)}draw(0);</script></body></html>
