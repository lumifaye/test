<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>typing test</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>typing test</h1><p>how fast can you type this random nonsense</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><p id='quote' class='big'></p><textarea id='in' rows='4' style='width:100%;margin-top:12px' placeholder='type here...'></textarea><p id='s'>start typing to start the timer</p><button id='new'>new text</button></section></main><script>const quotes=['the cat stole my sandwich and somehow blamed the printer','i opened one tab and now my computer sounds like a jet engine','this sentence is mostly here because the other one was boring','the tiny wizard has misplaced his extremely important soup'];let start=0;function next(){document.querySelector('#quote').textContent=quotes[Math.random()*quotes.length|0];document.querySelector('#in').value='';document.querySelector('#s').textContent='start typing to start the timer';start=0}document.querySelector('#in').oninput=e=>{if(!start)start=Date.now();let target=document.querySelector('#quote').textContent,v=e.target.value,correct=0;for(let i=0;i<Math.min(v.length,target.length);i++)if(v[i]===target[i])correct++;let sec=(Date.now()-start)/1000,wpm=Math.round(v.trim().split(/\s+/).filter(Boolean).length/Math.max(sec,1)*60);document.querySelector('#s').textContent='accuracy: '+Math.round(correct/Math.max(v.length,1)*100)+'% · about '+wpm+' wpm'+(v===target?' · done!':'')};document.querySelector('#new').onclick=next;next();</script></body></html>
