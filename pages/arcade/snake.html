</style></head><body><header><a href="../index.html">← back home</a> · <a href="../pages/mega-lab.html">experiment list</a><h1>Snake</h1><p>Eat the food and don't hit the wall or yourself.</p></header><main><div id="app"></div></main><script>let s=[ [8,8],[7,8],[6,8] ],d=[1,0],food=[13,12],over=false;function render(){app.innerHTML='<canvas width="400" height="400" style="width:min(100%,400px)"></canvas><p>Arrow keys or WASD to move.</p><button onclick="reset()">Restart</button>';let c=document.querySelector('canvas'),x=c.getContext('2d');function frame(){x.fillStyle='#080c16';x.fillRect(0,0,400,400);x.fillStyle='#ef4444';x.fillRect(food[0]*20,food[1]*20,18,18);x.fillStyle='#a78bfa';s.forEach(([a,b])=>x.fillRect(a*20,b*20,18,18));if(over)return;let h=[s[0][0]+d[0],s[0][1]+d[1]];if(h[0]<0||h[0]>19||h[1]<0||h[1]>19||s.some(([a,b])=>a===h[0]&&b===h[1])){over=true;x.fillStyle='white';x.fillText('Game over!',165,200);return}s.unshift(h);if(h[0]===food[0]&&h[1]===food[1])food=[Math.random()*20|0,Math.random()*20|0];else s.pop();setTimeout(()=>requestAnimationFrame(frame),100)}frame()}function reset(){s=[[8,8],[7,8],[6,8]];d=[1,0];over=false;render()}window.onkeydown=e=>{let m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(m&&m[0]!==-d[0]&&m[1]!==-d[1])d=m};render();</script></body></html>
