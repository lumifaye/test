</style></head><body><header><a href="../index.html">← back home</a> · <a href="../pages/mega-lab.html">experiment list</a><h1>Pong vs CPU</h1><p>Move your paddle to return the ball.</p></header><main><div id="app"></div></main><script>let y=160,cy=160,b={x:300,y:180,vx:4,vy:2},score=0;function render(){app.innerHTML='<canvas width="600" height="360" style="width:100%;touch-action:none"></canvas><p>Move pointer vertically to control the left paddle. Score: '+score+'</p><button onclick="reset()">Restart</button>';let c=document.querySelector('canvas'),x=c.getContext('2d');c.onpointermove=e=>{y=e.offsetY/c.clientHeight*360-40};function frame(){x.fillStyle='#080c16';x.fillRect(0,0,600,360);x.fillStyle='#a78bfa';x.fillRect(12,y,12,80);x.fillRect(576,cy,12,80);x.beginPath();x.arc(b.x,b.y,8,0,7);x.fill();b.x+=b.vx;b.y+=b.vy;cy+=(b.y-40-cy)*.035;if(b.y<8||b.y>352)b.vy*=-1;if(b.x<28&&b.y>y&&b.y<y+80){b.vx=Math.abs(b.vx)*1.04;score++}if(b.x>576&&b.y>cy&&b.y<cy+80)b.vx=-Math.abs(b.vx);if(b.x<0||b.x>600){b={x:300,y:180,vx:b.x<0?4:-4,vy:Math.random()*4-2}}requestAnimationFrame(frame)}frame()}function reset(){score=0;b={x:300,y:180,vx:4,vy:2};render()}render();</script></body></html>
