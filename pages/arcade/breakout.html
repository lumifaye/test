<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breakout | random stuff zone</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef2ff;font:15px system-ui,sans-serif}header{padding:22px 5vw;background:#0e1526;border-bottom:1px solid #293654}main{max-width:900px;margin:auto;padding:20px}a{color:#c4b5fd}button,input,textarea{font:inherit}button{background:#202d47;color:#eef2ff;border:1px solid #3b4b6b;border-radius:8px;padding:9px 12px;margin:4px;cursor:pointer}button:hover{border-color:#a78bfa}canvas{display:block;background:#080c16;border-radius:12px;margin:14px 0}p{color:#bac5df}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:480px}.tile{aspect-ratio:1;padding:0;margin:0}.life{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;max-width:500px}.life button{margin:0;padding:0;aspect-ratio:1}.maze{display:grid;grid-template-columns:repeat(21,1fr);max-width:500px}.maze i{aspect-ratio:1}.simon{display:grid;grid-template-columns:repeat(2,110px);gap:8px}.simon button{height:100px}.big{font-size:24px;padding:20px}textarea{width:100%;min-height:80px;background:#111a2c;color:white;border:1px solid #3b4b6b;border-radius:8px;padding:12px}
</style></head><body><header><a href="../index.html">← back home</a> · <a href="../pages/mega-lab.html">experiment list</a><h1>Breakout</h1><p>Move the paddle and clear the bricks.</p></header><main><div id="app"></div></main><script>let ball={x:220,y:280,vx:3,vy:-3},pad=190,bricks=new Set(Array.from({length:40},(_,i)=>i)),score=0;function render(){app.innerHTML='<canvas id="game" width="440" height="360"></canvas><p>Move mouse/finger to steer paddle. Score: '+score+'</p><button onclick="reset()">Restart</button>';let c=document.querySelector('canvas'),x=c.getContext('2d');c.onpointermove=e=>pad=e.offsetX-45;function frame(){x.fillStyle='#080c16';x.fillRect(0,0,440,360);for(let i of bricks){x.fillStyle='hsl('+i*8+' 80% 60%)';x.fillRect((i%10)*43+2,(i/10|0)*19+2,39,15)}x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,6,0,7);x.fill();x.fillRect(pad,337,90,8);ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<6||ball.x>434)ball.vx*=-1;if(ball.y<6)ball.vy*=-1;if(ball.y>326&&ball.x>pad&&ball.x<pad+90)ball.vy=-Math.abs(ball.vy);let col=Math.floor(ball.x/44),row=Math.floor(ball.y/19),i=row*10+col;if(row>=0&&row<4&&bricks.has(i)){bricks.delete(i);ball.vy*=-1;score++}if(ball.y<360&&bricks.size)requestAnimationFrame(frame);else x.fillText(bricks.size?'Game over':'All clear!',170,180)}frame()}function reset(){ball={x:220,y:280,vx:3,vy:-3};pad=190;bricks=new Set(Array.from({length:40},(_,i)=>i));score=0;render()}render();</script></body></html>
