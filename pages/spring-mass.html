<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0d17"><title>Spring Mass | random stuff zone</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090d18;color:#edf1ff;font:15px system-ui,sans-serif}header{padding:22px clamp(16px,4vw,40px);border-bottom:1px solid #283653;background:radial-gradient(ellipse at 80% 0,#30285c,transparent 55%),#0d1323}a{color:#bdb3ff}h1{margin:8px 0;font-size:clamp(28px,5vw,48px);letter-spacing:-.05em}p{color:#b7c3e2;max-width:700px;line-height:1.55}.tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#bdb3ff}main{max-width:1100px;margin:auto;padding:20px}canvas{display:block;width:100%;height:min(62vh,560px);background:#080c16;border:1px solid #293654;border-radius:14px;touch-action:none}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}button{background:#202944;color:#fff;border:1px solid #455579;border-radius:9px;padding:10px 14px;cursor:pointer}button:hover{border-color:#b4a6ff}label{color:#b7c3e2;display:flex;align-items:center;gap:8px}small{color:#8e9bb9}</style></head>
<body><header><a href="../index.html">← all the stuff</a><div class="tag">🪀 little browser experiment #16</div><h1>Spring Mass</h1><p>Drag a mass and watch the spring bounce.</p></header><main><canvas id="c" aria-label="Spring Mass interactive canvas"></canvas><div class="tools"><button id="reset">randomize / reset</button><button id="pause">pause</button><button id="clear">clear trails</button><label>speed <input id="speed" type="range" min=".2" max="2.5" value="1" step=".1"></label><label>amount <input id="amount" type="range" min="20" max="240" value="120" step="10"></label></div><p id="hint">Click or drag on the canvas to poke it. Change the sliders and see what happens.</p><small>Vanilla HTML canvas, no libraries, no installs. Experiment #16 / 200.</small></main>
<script>
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),mode="spring",seed=32;
let w=800,h=500,paused=false,t=0,points=[],mouse={x:400,y:250,down:false},hues=seed%360;
function rnd(n){return Math.random()*n}
function resize(){let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);seedPoints()}
function seedPoints(){points=[];let n=+document.querySelector('#amount').value;for(let k=0;k<n;k++)points.push({x:rnd(w),y:rnd(h),vx:rnd(2)-1,vy:rnd(2)-1,r:2+rnd(5),a:rnd(6.28),h:rnd(360),life:rnd(1)})}
function clear(){ctx.fillStyle='#080c16';ctx.fillRect(0,0,w,h)}
function frame(){requestAnimationFrame(frame);if(paused)return;t+=.012*+document.querySelector('#speed').value;let n=points.length;ctx.fillStyle='rgba(8,12,22,.22)';ctx.fillRect(0,0,w,h);ctx.save();ctx.globalCompositeOperation='lighter';
if(mode==='bars'){for(let x=0;x<w;x+=5){let z=Math.abs(Math.sin(x*.025+t*3)*Math.cos(x*.008-t))*h*.65;ctx.fillStyle='hsl('+(x*.4+t*20+hues)%360+' 90% 62%)';ctx.fillRect(x,h-z,3,z)}}
else if(mode==='waves'||mode==='ripple'||mode==='wavetank'||mode==='interference'){for(let k=0;k<7;k++){ctx.beginPath();for(let x=0;x<w;x+=3){let y=h/2+Math.sin(x*.018+t*2+k*.8)*35+Math.sin(x*.045-t*1.5+k)*15; k===0&&x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.strokeStyle='hsla('+(hues+k*28+t*10)%360+',90%,65%,.65)';ctx.lineWidth=2;ctx.stroke()}}
else if(mode==='pendulum'||mode==='double'||mode==='clock'||mode==='pendlab'){for(let k=0;k<8;k++){let x=w/2+Math.sin(t*(.7+k*.07)+k)*Math.min(w*.35,220),y=h*.16+Math.abs(Math.cos(t*(.7+k*.07)+k))*h*.65;ctx.strokeStyle='hsl('+(hues+k*32)+' 85% 65%)';ctx.beginPath();ctx.moveTo(w/2,h*.12);ctx.lineTo(x,y);ctx.stroke();ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fillStyle=ctx.strokeStyle;ctx.fill()}}
else if(mode==='plant'||mode==='tree'||mode==='fractaltree'||mode==='bolt'){function branch(x,y,a,len,depth){if(depth<=0)return;let nx=x+Math.cos(a)*len,ny=y+Math.sin(a)*len;ctx.strokeStyle='hsl('+(105+depth*9+hues)%360+' 70% '+(35+depth*5)+'%)';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.stroke();branch(nx,ny,a-.45+Math.sin(t+depth)*.04,len*.72,depth-1);branch(nx,ny,a+.45+Math.cos(t+depth)*.04,len*.72,depth-1)}ctx.lineWidth=1.5;branch(w/2,h*.95,-Math.PI/2,h*.18,8)}
else if(mode==='matrix'||mode==='digirain'){for(let k=0;k<n;k++){let p=points[k];p.y=(p.y+2+p.r*2)%h;ctx.fillStyle='hsl(125 95% '+(35+rnd(35))+'%)';ctx.font='14px monospace';ctx.fillText(String.fromCharCode(0x30a0+Math.floor(rnd(96))),p.x,p.y)}}
else if(mode==='laser'||mode==='lasershow'||mode==='reflect'){for(let k=0;k<8;k++){let a=t*(k%2?1:-1)+k*.8;ctx.strokeStyle='hsla('+(hues+k*45+t*30)%360+',100%,65%,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w/2,h/2);ctx.lineTo(w/2+Math.cos(a)*w, h/2+Math.sin(a)*h);ctx.stroke()}}
else if(mode==='checker'||mode==='wire3d'||mode==='impossible'||mode==='retrotunnel'||mode==='retrotunnel'||mode==='tunnel3d'){for(let z=1;z<18;z++){let r=(z*15+(t*80)%15);ctx.strokeStyle='hsla('+(hues+z*16+t*15)%360+',80%,60%,.6)';ctx.beginPath();ctx.ellipse(w/2,h/2,r*1.6,r, t*.3,0,7);ctx.stroke()}for(let a=0;a<24;a++){let an=a*Math.PI/12+t*.1;ctx.strokeStyle='hsla('+(hues+a*14)%360+',90%,65%,.45)';ctx.beginPath();ctx.moveTo(w/2,h/2);ctx.lineTo(w/2+Math.cos(an)*w,h/2+Math.sin(an)*h);ctx.stroke()}}
else if(mode==='cells'||mode==='life'||mode==='reactgrid'){let s=10;for(let x=0;x<w;x+=s)for(let y=0;y<h;y+=s){let v=(Math.sin(x*.04+t)*Math.cos(y*.05-t)+Math.sin((x+y)*.015+t*2));if(v>.25){ctx.fillStyle='hsl('+(hues+v*100+x*.1)%360+' 75% 58%)';ctx.fillRect(x,y,s-1,s-1)}}}
else if(mode==='voronoi'||mode==='vpaint'||mode==='tiles'||mode==='tessellation'){let s=45;for(let x=0;x<w;x+=s)for(let y=0;y<h;y+=s){ctx.fillStyle='hsl('+(hues+x*.3+y*.2+Math.sin(t+x*.01+y*.02)*60)%360+' 70% 50%)';ctx.beginPath();ctx.moveTo(x,y);for(let q=0;q<6;q++){let a=q*Math.PI/3;ctx.lineTo(x+s/2+Math.cos(a)*s/2,y+s/2+Math.sin(a)*s/2)}ctx.closePath();ctx.fill()}}
else if(mode==='synthwave'||mode==='city'||mode==='sunset'){let sy=h*.48;let g=ctx.createLinearGradient(0,sy,0,h);g.addColorStop(0,'#f54aa5');g.addColorStop(1,'#10102d');ctx.fillStyle=g;ctx.fillRect(0,sy,w,h-sy);ctx.fillStyle='#111326';ctx.beginPath();ctx.arc(w/2,sy,Math.min(w,h)*.2,0,7);ctx.fill();ctx.strokeStyle='#ff85ce';for(let y=sy;y<h;y+=Math.max(4,(y-sy)*.07)){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(let x=-w;x<w*2;x+=45){ctx.beginPath();ctx.moveTo(w/2,sy);ctx.lineTo(x,h);ctx.stroke()}}
else if(mode==='glitch'||mode==='tv'||mode==='analog'||mode==='datamosh'){for(let k=0;k<35;k++){let y=rnd(h),hh=rnd(20)+2;ctx.fillStyle='hsla('+rnd(360)+',90%,60%,.8)';ctx.fillRect(rnd(w),y,rnd(w*.7),hh)}}
else if(mode==='sand'||mode==='hourglass'||mode==='snow'||mode==='snowfall'||mode==='leaves'||mode==='confetti'){for(let p of points){p.y+=p.vy*2+1;p.x+=Math.sin(t+p.a)*1.2;if(p.y>h){p.y=0;p.x=rnd(w)}ctx.fillStyle='hsl('+(mode==='snow'?200:p.h)+' 85% 68%)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}}
else if(mode==='fractal'||mode==='curve'||mode==='spiro'||mode==='hypo'||mode==='epi'||mode==='orbitdraw'||mode==='lissajous'){ctx.beginPath();for(let q=0;q<2200;q++){let a=q*.025+t*.15,r=90+45*Math.sin(q*.013+ t);let x=w/2+Math.cos(a*2)*r+Math.cos(a*3)*r*.4,y=h/2+Math.sin(a*3)*r*.65;if(q===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle='hsl('+(hues+t*25)%360+' 90% 68%)';ctx.lineWidth=1.4;ctx.stroke()}
else if(mode==='maze'||mode==='dungeon'||mode==='rogue'||mode==='cave'||mode==='backrooms'){let s=28;for(let x=0;x<w;x+=s)for(let y=0;y<h;y+=s){if(Math.sin(x*.12+y*.17+t*.1)>-.05){ctx.fillStyle='#18243a';ctx.fillRect(x+1,y+1,s-2,s-2);if(Math.sin(x*.1-y*.13)>0.8){ctx.fillStyle='#9c88ff';ctx.fillRect(x+9,y+9,5,5)}}}}
else if(mode==='planet'||mode==='rings'||mode==='ringsim'||mode==='planetaryrings'||mode==='moon'||mode==='daynight'){let r=Math.min(w,h)*.25;ctx.save();ctx.translate(w/2,h/2);ctx.rotate(t*.15);ctx.strokeStyle='#d9b7ff';for(let q=0;q<5;q++){ctx.beginPath();ctx.ellipse(0,0,r*(1.3+q*.13),r*.4,0,0,7);ctx.stroke()}ctx.fillStyle=ctx.createRadialGradient(-r*.4,-r*.4,1,0,0,r);ctx.fillStyle='#4d83c8';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.restore()}
else if(mode==='bars'||mode==='freq'||mode==='scope'||mode==='soundwave'){ctx.beginPath();for(let x=0;x<w;x+=2){let y=h/2+Math.sin(x*.03+t*3)*Math.sin(x*.007+t)*h*.3;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.strokeStyle='#79e8ff';ctx.lineWidth=2;ctx.stroke()}
else if(mode==='plant'||mode==='flowers'||mode==='coral'){for(let k=0;k<18;k++){let x=(k+.5)*w/18,y=h*.9;ctx.strokeStyle='hsl(125 50% 45%)';ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+Math.sin(t+k)*40,h*.5,x+Math.sin(t+k)*55,h*.35);ctx.stroke();ctx.fillStyle='hsl('+(hues+k*20+t*20)%360+' 85% 65%)';ctx.beginPath();ctx.arc(x+Math.sin(t+k)*55,h*.35,9,0,7);ctx.fill()}}
else {for(let p of points){let dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy)||1;if(mouse.down&&d<150){p.vx+=dx/d*.2;p.vy+=dy/d*.2}p.vx+=Math.sin(t+p.a)*.012;p.vy+=Math.cos(t*.7+p.a)*.012;p.x+=p.vx*1.5*+document.querySelector('#speed').value;p.y+=p.vy*1.5*+document.querySelector('#speed').value;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;p.vx*=.995;p.vy*=.995;ctx.fillStyle='hsla('+(p.h+hues+t*12)%360+',90%,65%,.8)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.strokeStyle='hsla('+(p.h+hues)%360+',90%,65%,.12)';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*18,p.y-p.vy*18);ctx.stroke()}}
ctx.restore();ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='12px system-ui';ctx.fillText('click / drag to interact · '+mode,12,h-12)}
function pos(e){let r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top}
canvas.addEventListener('pointerdown',e=>{mouse.down=true;pos(e);if(mode==='paint'||mode==='symmetry'||mode==='kaleido'||mode==='mandala'){let count=mode==='symmetry'?8:mode==='kaleido'||mode==='mandala'?12:1;for(let j=0;j<count;j++){let a=j*Math.PI*2/count;ctx.fillStyle='hsl('+rnd(360)+' 95% 65%)';ctx.beginPath();ctx.arc(mouse.x+Math.cos(a)*8,mouse.y+Math.sin(a)*8,7,0,7);ctx.fill()}}});canvas.addEventListener('pointermove',pos);window.addEventListener('pointerup',()=>mouse.down=false);
document.querySelector('#reset').onclick=()=>{hues=rnd(360);seedPoints();clear()};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'resume':'pause'};document.querySelector('#clear').onclick=clear;document.querySelector('#amount').oninput=seedPoints;window.addEventListener('resize',resize);resize();clear();frame();
</script></body></html>
