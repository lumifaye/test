<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>doodle pad</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>doodle pad</h1><p>draw whatever. yes thats the whole thing</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='900' height='520' style='background:#f4f3ee'></canvas><div class='row'><label>pen <input id='col' type='color' value='#24243b'></label><label>size <input id='sz' type='range' min='1' max='40' value='6'></label><button id='clear'>wipe it</button><button id='save'>save png</button></div></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let d=false,prev=null;x.fillStyle='#f4f3ee';x.fillRect(0,0,c.width,c.height);c.onpointerdown=e=>{d=true;prev=[e.offsetX/c.clientWidth*c.width,e.offsetY/c.clientHeight*c.height];c.setPointerCapture(e.pointerId)};c.onpointerup=()=>d=false;c.onpointermove=e=>{if(!d)return;let p=[e.offsetX/c.clientWidth*c.width,e.offsetY/c.clientHeight*c.height];x.strokeStyle=document.querySelector('#col').value;x.lineWidth=document.querySelector('#sz').value;x.lineCap='round';x.beginPath();x.moveTo(...prev);x.lineTo(...p);x.stroke();prev=p};document.querySelector('#clear').onclick=()=>{x.fillStyle='#f4f3ee';x.fillRect(0,0,c.width,c.height)};document.querySelector('#save').onclick=()=>{let a=document.createElement('a');a.download='doodle.png';a.href=c.toDataURL();a.click()};</script></body></html>
