<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>fractal zoomies</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>fractal zoomies</h1><p>look at the mandelbrot thing</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='760' height='500'></canvas><p>click to zoom in around that spot. double click to zoom back out.</p><button id='reset'>start over</button></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let scale=3,ox=-.5,oy=0;function draw(){const im=x.createImageData(c.width,c.height);for(let py=0;py<c.height;py++)for(let px=0;px<c.width;px++){let a=(px/c.width-.5)*scale+ox,b=(py/c.height-.5)*scale*c.height/c.width+oy,za=0,zb=0,i=0;while(za*za+zb*zb<4&&i<45){let t=za*za-zb*zb+a;zb=2*za*zb+b;za=t;i++}let n=(py*c.width+px)*4;im.data[n]=i*7;im.data[n+1]=i*3;im.data[n+2]=Math.min(255,i*12);im.data[n+3]=255}x.putImageData(im,0,0)}c.onclick=e=>{ox+=(e.offsetX/c.clientWidth-.5)*scale;oy+=(e.offsetY/c.clientHeight-.5)*scale*c.height/c.width;scale*=.65;draw()};c.ondblclick=()=>{scale=3;ox=-.5;oy=0;draw()};document.querySelector('#reset').onclick=()=>{scale=3;ox=-.5;oy=0;draw()};draw();</script></body></html>
