<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>snake time</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>snake time</h1><p>eat dots and dont run into yourself</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='500' height='500'></canvas><p>arrow keys to move. press space to pause.</p><div id='s'>score: 0</div></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let snake=[{x:10,y:10}],dir={x:1,y:0},food={x:15,y:12},score=0,paused=false;onkeydown=e=>{if(e.code==='Space')paused=!paused;if(e.key==='ArrowUp'&&dir.y!==1)dir={x:0,y:-1};if(e.key==='ArrowDown'&&dir.y!==-1)dir={x:0,y:1};if(e.key==='ArrowLeft'&&dir.x!==1)dir={x:-1,y:0};if(e.key==='ArrowRight'&&dir.x!==-1)dir={x:1,y:0}};function step(){if(!paused){let h={x:(snake[0].x+dir.x+25)%25,y:(snake[0].y+dir.y+25)%25};if(snake.some(p=>p.x===h.x&&p.y===h.y)){snake=[{x:10,y:10}];score=0}else{snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;food={x:Math.random()*25|0,y:Math.random()*25|0}}else snake.pop()}}x.fillStyle='#10192a';x.fillRect(0,0,500,500);snake.forEach(p=>{x.fillStyle='#8df0bc';x.fillRect(p.x*20+2,p.y*20+2,16,16)});x.fillStyle='#ff718e';x.fillRect(food.x*20+3,food.y*20+3,14,14);document.querySelector('#s').textContent='score: '+score+(paused?' · paused':'');setTimeout(step,110)}step();</script></body></html>
