<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pixel art thing</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>pixel art thing</h1><p>make tiny art, one square at a time</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='480' height='480' style='max-width:480px;image-rendering:pixelated'></canvas><div class='row'><label>color <input id='col' type='color' value='#ff638e'></label><button id='erase'>eraser</button><button id='clear'>clear</button><button id='save'>save png</button></div></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let color='#ff638e',erase=false;function grid(){x.fillStyle='#fff';x.fillRect(0,0,480,480);x.strokeStyle='#ddd';for(let i=0;i<=480;i+=20){x.beginPath();x.moveTo(i,0);x.lineTo(i,480);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(480,i);x.stroke()}}function paint(e){let a=Math.floor(e.offsetX/c.clientWidth*24)*20,b=Math.floor(e.offsetY/c.clientHeight*24)*20;x.fillStyle=erase?'#fff':color;x.fillRect(a,b,20,20);x.strokeStyle='#ddd';x.strokeRect(a,b,20,20)}let down=false;c.onpointerdown=e=>{down=true;paint(e)};c.onpointermove=e=>{if(down)paint(e)};c.onpointerup=()=>down=false;document.querySelector('#col').oninput=e=>{color=e.target.value;erase=false};document.querySelector('#erase').onclick=()=>erase=!erase;document.querySelector('#clear').onclick=grid;document.querySelector('#save').onclick=()=>{let a=document.createElement('a');a.download='pixel-art.png';a.href=c.toDataURL();a.click()};grid();</script></body></html>
