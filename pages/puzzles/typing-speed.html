</style></head><body><header><a href="../index.html">← back home</a> · <a href="../pages/mega-lab.html">experiment list</a><h1>Typing Sprint</h1><p>Type the displayed sentence accurately.</p></header><main><div id="app"></div></main><script>const words=['tiny browser toys are surprisingly fun','make something weird and see what happens','the quick fox jumps over the quiet dog','pixels glow softly in the midnight sky'];let target='',begin=0;function init(){target=words[Math.random()*words.length|0];begin=0;render()}function render(){app.innerHTML='<h2>'+target+'</h2><textarea id="typed" placeholder="Start typing…" oninput="check()"></textarea><p id="result">Type the sentence above.</p><button onclick="init()">New sentence</button>'}function check(){let v=document.querySelector('#typed').value;if(!begin&&v.length)begin=Date.now();let correct=0;while(correct<v.length&&v[correct]===target[correct])correct++;document.querySelector('#result').textContent=correct+'/'+target.length+' correct · '+(begin?Math.round(v.length/Math.max(1,(Date.now()-begin)/60000))+' WPM':'');if(v===target)document.querySelector('#result').textContent+=' · finished!'}init();</script></body></html>
