<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>desktop aquarium</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>desktop aquarium</h1><p>fish are just doing their thing</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='760' height='460'></canvas><p>click to drop some food. fish will investigate.</p><div class='row'><button id='fish'>add fish</button><button id='weed'>add seaweed</button></div></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let fish=Array.from({length:8},()=>({x:Math.random()*760,y:70+Math.random()*300,v:Math.random()*2+1,col=['#ff9fbc','#ffe08b','#89e7ff','#b7a0ff'][Math.random()*4|0]})),food=[];c.onclick=e=>food.push({x:e.offsetX/c.clientWidth*760,y:e.offsetY/c.clientHeight*460});document.querySelector('#fish').onclick=()=>fish.push({x:Math.random()*760,y:Math.random()*400+30,v:Math.random()*2+1,col:'#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0')});document.querySelector('#weed').onclick=()=>{x.strokeStyle='#4cc59a';x.beginPath();x.moveTo(Math.random()*760,460);x.quadraticCurveTo(Math.random()*760,300,Math.random()*760,370);x.stroke()};function draw(){x.fillStyle='#0b4161';x.fillRect(0,0,760,460);for(let i=0;i<20;i++){x.strokeStyle='#ffffff12';x.beginPath();x.arc(i*43,(Date.now()/80+i*71)%460,5,0,7);x.stroke()}food.forEach(f=>{x.fillStyle='#ffe69a';x.beginPath();x.arc(f.x,f.y,4,0,7);x.fill()});fish.forEach(f=>{if(food.length){let t=food[0];f.x+=(t.x-f.x)*.004;f.y+=(t.y-f.y)*.004;if(Math.hypot(t.x-f.x,t.y-f.y)<15)food.shift()}else{f.x+=f.v;if(f.x>800)f.x=-40}x.fillStyle=f.col;x.beginPath();x.ellipse(f.x,f.y,19,10,0,0,7);x.fill();x.beginPath();x.moveTo(f.x-15,f.y);x.lineTo(f.x-29,f.y-9);x.lineTo(f.x-29,f.y+9);x.fill()});requestAnimationFrame(draw)}draw();</script></body></html>
