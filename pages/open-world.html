<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tiny open world</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>tiny open world</h1><p>wander around a little pixel world</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='760' height='500'></canvas><p>WASD / arrows to walk. see what you find.</p><div class='note' id='status'>you spawned near the middle</div></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),keys={};let px=380,py=250,camx=0,camy=0;onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;const things=[];for(let i=0;i<220;i++)things.push({x:Math.random()*2600-1300,y:Math.random()*2000-1000,t:Math.random()});function draw(){if(keys.w||keys.arrowup)py-=3;if(keys.s||keys.arrowdown)py+=3;if(keys.a||keys.arrowleft)px-=3;if(keys.d||keys.arrowright)px+=3;camx=px-380;camy=py-250;x.fillStyle='#172b2c';x.fillRect(0,0,760,500);for(let gx=-((camx%80)+80)%80;gx<760;gx+=80)for(let gy=-((camy%80)+80)%80;gy<500;gy+=80){x.fillStyle='#203b35';x.fillRect(gx,gy,78,78)}things.forEach(o=>{let sx=o.x-camx,sy=o.y-camy;if(sx>-40&&sx<800&&sy>-40&&sy<540){x.fillStyle=o.t>.45?'#355b37':'#876747';x.beginPath();x.arc(sx,sy,o.t>.45?13:7,0,7);x.fill();if(o.t>.45){x.fillStyle='#6d9b56';x.beginPath();x.arc(sx,sy-9,11,0,7);x.fill()}}});x.fillStyle='#f4d36e';x.fillRect(370,240,20,20);document.querySelector('#status').textContent='world position: '+Math.round(px)+', '+Math.round(py)+' · '+things.filter(o=>Math.hypot(o.x-px,o.y-py)<70).length+' things nearby';requestAnimationFrame(draw)}draw();</script></body></html>
