<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tiny tower defense</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>tiny tower defense</h1><p>put towers down and dont let the squares through</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='760' height='420'></canvas><p>click anywhere to place a tower. towers shoot at red squares.</p><div id='s'>cash: 100</div><button id='reset'>restart</button></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');let towers=[],en=[],cash=100,lives=10,t=0;c.onclick=e=>{if(cash>=25){towers.push({x:e.offsetX/c.clientWidth*760,y:e.offsetY/c.clientHeight*420,cool:0});cash-=25}};document.querySelector('#reset').onclick=()=>{towers=[];en=[];cash=100;lives=10;t=0};function draw(){t++;x.fillStyle='#172b25';x.fillRect(0,0,760,420);x.strokeStyle='#6c7254';x.lineWidth=38;x.beginPath();x.moveTo(0,100);x.lineTo(250,100);x.lineTo(250,300);x.lineTo(540,300);x.lineTo(540,160);x.lineTo(760,160);x.stroke();if(t%70===0)en.push({x:0,y:100,hp:3,seg:0});en.forEach(e=>{let pts=[[0,100],[250,100],[250,300],[540,300],[540,160],[760,160]],p=pts[Math.min(e.seg+1,5)];e.x+=Math.sign(p[0]-e.x)*1.2;e.y+=Math.sign(p[1]-e.y)*1.2;if(Math.hypot(p[0]-e.x,p[1]-e.y)<3)e.seg=Math.min(5,e.seg+1);x.fillStyle='#ff6f80';x.fillRect(e.x-8,e.y-8,16,16)});towers.forEach(a=>{x.fillStyle='#8b7cff';x.beginPath();x.arc(a.x,a.y,13,0,7);x.fill();a.cool--;if(a.cool<=0){let e=en.find(e=>Math.hypot(e.x-a.x,e.y-a.y)<120);if(e){e.hp--;a.cool=25;if(e.hp<=0){en=en.filter(q=>q!==e);cash+=10}}}});document.querySelector('#s').textContent='cash: '+cash+' · lives: '+lives+' · red squares: '+en.length;requestAnimationFrame(draw)}draw();</script></body></html>
