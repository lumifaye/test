</style></head><body><header><a href="../index.html">← back home</a> · <a href="../pages/mega-lab.html">experiment list</a><h1>Wave Lab</h1><p>Adjust frequency and amplitude to shape a waveform.</p></header><main><div id="app"></div></main><script>function render(){app.innerHTML='<label>Frequency <input id="freq" type="range" min="1" max="20" value="4"></label><label>Amplitude <input id="amp" type="range" min="10" max="180" value="90"></label><canvas width="700" height="300" style="width:100%"></canvas>';let c=document.querySelector('canvas'),x=c.getContext('2d'),t=0;function frame(){t+=.025;x.fillStyle='#080c16';x.fillRect(0,0,700,300);x.strokeStyle='#a78bfa';x.lineWidth=2;x.beginPath();for(let px=0;px<700;px++){let y=150+Math.sin(px*.02*+document.querySelector('#freq').value+t)*+document.querySelector('#amp').value;px?x.lineTo(px,y):x.moveTo(px,y)}x.stroke();requestAnimationFrame(frame)}frame()}render();</script></body></html>
