<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Four | random stuff zone</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef2ff;font:15px system-ui,sans-serif}header{padding:22px 5vw;background:#0e1526;border-bottom:1px solid #293654}main{max-width:900px;margin:auto;padding:20px}a{color:#c4b5fd}button,input,textarea{font:inherit}button{background:#202d47;color:#eef2ff;border:1px solid #3b4b6b;border-radius:8px;padding:9px 12px;margin:4px;cursor:pointer}button:hover{border-color:#a78bfa}canvas{display:block;background:#080c16;border-radius:12px;margin:14px 0}p{color:#bac5df}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:480px}.tile{aspect-ratio:1;padding:0;margin:0}.life{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;max-width:500px}.life button{margin:0;padding:0;aspect-ratio:1}.maze{display:grid;grid-template-columns:repeat(21,1fr);max-width:500px}.maze i{aspect-ratio:1}.simon{display:grid;grid-template-columns:repeat(2,110px);gap:8px}.simon button{height:100px}.big{font-size:24px;padding:20px}textarea{width:100%;min-height:80px;background:#111a2c;color:white;border:1px solid #3b4b6b;border-radius:8px;padding:12px}
</style></head><body><header><a href="../index.html">← back home</a> · <a href="../pages/mega-lab.html">experiment list</a><h1>Connect Four</h1><p>Get four in a row before the computer.</p></header><main><div id="app"></div></main><script>let b=Array(42).fill(0),turn=1;function win(p){for(let i=0;i<42;i++)if(b[i]===p)for(let d of [1,7,6,8]){let j=i+d*3;if(j<42&&[0,1,2,3].every(k=>b[i+d*k]===p)&&!(d===1&&i%7>3))return true}return false}function render(){app.innerHTML='<p>'+ (turn===1?'Your turn (red)':'Computer (yellow)')+'</p><div class="grid">'+Array.from({length:42},(_,i)=>'<button class="tile" style="border-radius:50%;background:'+(b[i]===1?'#ef4444':b[i]===2?'#facc15':'#23324d')+'" onclick="drop('+(i%7)+')"></button>').join('')+'</div><button onclick="b=Array(42).fill(0);turn=1;render()">Restart</button>'}function drop(c){if(turn!==1)return;for(let r=5;r>=0;r--){let i=r*7+c;if(!b[i]){b[i]=1;if(win(1)){turn=0;render();app.insertAdjacentHTML('afterbegin','<h2>You win!</h2>');return}turn=2;render();setTimeout(cpu,300);return}}}function cpu(){let c=Math.random()*7|0;for(let n=0;n<7;n++){let cc=(c+n)%7;for(let r=5;r>=0;r--){let i=r*7+cc;if(!b[i]){b[i]=2;turn=1;if(win(2)){turn=0;render();app.insertAdjacentHTML('afterbegin','<h2>Computer wins!</h2>');return}render();return}}}}render();</script></body></html>
