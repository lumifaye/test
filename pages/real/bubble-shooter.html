<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bubble Shooter | random stuff zone</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef2ff;font:15px system-ui,sans-serif}header{padding:22px 5vw;background:#0e1526;border-bottom:1px solid #293654}main{max-width:900px;margin:auto;padding:20px}a{color:#c4b5fd}button,input,textarea{font:inherit}button{background:#202d47;color:#eef2ff;border:1px solid #3b4b6b;border-radius:8px;padding:9px 12px;margin:4px;cursor:pointer}button:hover{border-color:#a78bfa}canvas{display:block;background:#080c16;border-radius:12px;margin:14px 0}p{color:#bac5df}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:480px}.tile{aspect-ratio:1;padding:0;margin:0}.life{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;max-width:500px}.life button{margin:0;padding:0;aspect-ratio:1}.maze{display:grid;grid-template-columns:repeat(21,1fr);max-width:500px}.maze i{aspect-ratio:1}.simon{display:grid;grid-template-columns:repeat(2,110px);gap:8px}.simon button{height:100px}.big{font-size:24px;padding:20px}textarea{width:100%;min-height:80px;background:#111a2c;color:white;border:1px solid #3b4b6b;border-radius:8px;padding:12px}
</style></head><body><header><a href="../index.html">← back home</a> · <a href="../pages/mega-lab.html">experiment list</a><h1>Bubble Shooter</h1><p>Aim and shoot colored bubbles to make groups.</p></header><main><div id="app"></div></main><script>let bubbles=[];for(let r=0;r<5;r++)for(let c=0;c<10;c++)bubbles.push({x:25+c*35,y:25+r*31,c:Math.random()*5|0});let shot=null;function render(){app.innerHTML='<canvas width="400" height="500" style="width:min(100%,400px);touch-action:none"></canvas><p>Click to shoot a bubble toward the cursor.</p><button onclick="bubbles=[];render()">Clear board</button>';let c=document.querySelector('canvas'),x=c.getContext('2d');c.onclick=e=>{let r=c.getBoundingClientRect(),tx=(e.clientX-r.left)/r.width*400,ty=(e.clientY-r.top)/r.height*500;shot={x:200,y:470,vx:(tx-200)/35,vy:(ty-470)/35,col:Math.random()*5|0};animate()};function animate(){x.fillStyle='#080c16';x.fillRect(0,0,400,500);for(let b of bubbles){x.fillStyle=['#f87171','#facc15','#60a5fa','#4ade80','#c084fc'][b.c];x.beginPath();x.arc(b.x,b.y,14,0,7);x.fill()}if(shot){shot.x+=shot.vx;shot.y+=shot.vy;if(shot.x<14||shot.x>386)shot.vx*=-1;if(shot.y<14||bubbles.some(b=>Math.hypot(b.x-shot.x,b.y-shot.y)<26)){bubbles.push({x:shot.x,y:shot.y,c:shot.col});shot=null}else if(shot){x.fillStyle='white';x.beginPath();x.arc(shot.x,shot.y,14,0,7);x.fill();requestAnimationFrame(animate)}}}animate()}render();</script></body></html>
