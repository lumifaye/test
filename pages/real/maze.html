<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maze Generator | random stuff zone</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef2ff;font:15px system-ui,sans-serif}header{padding:22px 5vw;background:#0e1526;border-bottom:1px solid #293654}main{max-width:900px;margin:auto;padding:20px}a{color:#c4b5fd}button,input,textarea{font:inherit}button{background:#202d47;color:#eef2ff;border:1px solid #3b4b6b;border-radius:8px;padding:9px 12px;margin:4px;cursor:pointer}button:hover{border-color:#a78bfa}canvas{display:block;background:#080c16;border-radius:12px;margin:14px 0}p{color:#bac5df}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:480px}.tile{aspect-ratio:1;padding:0;margin:0}.life{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;max-width:500px}.life button{margin:0;padding:0;aspect-ratio:1}.maze{display:grid;grid-template-columns:repeat(21,1fr);max-width:500px}.maze i{aspect-ratio:1}.simon{display:grid;grid-template-columns:repeat(2,110px);gap:8px}.simon button{height:100px}.big{font-size:24px;padding:20px}textarea{width:100%;min-height:80px;background:#111a2c;color:white;border:1px solid #3b4b6b;border-radius:8px;padding:12px}
</style></head><body><header><a href="../index.html">← back home</a> · <a href="../pages/mega-lab.html">experiment list</a><h1>Maze Generator</h1><p>Generate a maze and solve it with BFS.</p></header><main><div id="app"></div></main><script>let size=21,grid=[];function generate(){grid=Array.from({length:size*size},()=>1);function carve(x,y){grid[y*size+x]=0;let dirs=[[0,-2],[2,0],[0,2],[-2,0]].sort(()=>Math.random()-.5);for(let [dx,dy] of dirs){let nx=x+dx,ny=y+dy;if(nx>0&&ny>0&&nx<size-1&&ny<size-1&&grid[ny*size+nx]){grid[(y+dy/2)*size+x+dx/2]=0;carve(nx,ny)}}}carve(1,1);draw()}function draw(){app.innerHTML='<button onclick="generate()">New maze</button><button onclick="solve()">Solve</button><div class="maze">'+grid.map((v,i)=>'<i style="background:'+(i===size*size-2?'#ef4444':v?'#35415a':'#0e1728')+'"></i>').join('')+'</div>'}function solve(){let q=[size+1],prev=new Map([[size+1,-1]]),goal=size*size-2;while(q.length){let i=q.shift();if(i===goal)break;for(let j of [i-1,i+1,i-size,i+size])if(j>=0&&j<grid.length&&!grid[j]&&!prev.has(j)){prev.set(j,i);q.push(j)}}let p=goal;while(prev.has(p)&&p!==-1){grid[p]=2;p=prev.get(p)}draw();document.querySelectorAll('.maze i').forEach((e,i)=>{if(grid[i]===2)e.style.background='#facc15'})}generate();</script></body></html>
