<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simon Says | random stuff zone</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef2ff;font:15px system-ui,sans-serif}header{padding:22px 5vw;background:#0e1526;border-bottom:1px solid #293654}main{max-width:900px;margin:auto;padding:20px}a{color:#c4b5fd}button,input,textarea{font:inherit}button{background:#202d47;color:#eef2ff;border:1px solid #3b4b6b;border-radius:8px;padding:9px 12px;margin:4px;cursor:pointer}button:hover{border-color:#a78bfa}canvas{display:block;background:#080c16;border-radius:12px;margin:14px 0}p{color:#bac5df}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:480px}.tile{aspect-ratio:1;padding:0;margin:0}.life{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;max-width:500px}.life button{margin:0;padding:0;aspect-ratio:1}.maze{display:grid;grid-template-columns:repeat(21,1fr);max-width:500px}.maze i{aspect-ratio:1}.simon{display:grid;grid-template-columns:repeat(2,110px);gap:8px}.simon button{height:100px}.big{font-size:24px;padding:20px}textarea{width:100%;min-height:80px;background:#111a2c;color:white;border:1px solid #3b4b6b;border-radius:8px;padding:12px}
</style></head><body><header><a href="../index.html">← back home</a> · <a href="../pages/mega-lab.html">experiment list</a><h1>Simon Says</h1><p>Repeat the color sequence.</p></header><main><div id="app"></div></main><script>const colors=['#ef4444','#22c55e','#3b82f6','#eab308'];let seq=[],at=0,showing=false;function render(){app.innerHTML='<h2>Round '+seq.length+'</h2><div class="simon">'+colors.map((c,i)=>'<button style="background:'+c+'" onclick="press('+i+')"></button>').join('')+'</div><p id="msg">Press start, then repeat the sequence.</p><button onclick="start()">Start</button>'}function flash(i){let el=document.querySelectorAll('.simon button')[i];el.style.filter='brightness(2)';setTimeout(()=>el.style.filter='',260)}function start(){seq=[];next()}function next(){seq.push(Math.random()*4|0);at=0;showing=true;render();seq.forEach((v,i)=>setTimeout(()=>flash(v),450*i+300));setTimeout(()=>showing=false,450*seq.length+350)}function press(i){if(showing||!seq.length)return;flash(i);if(seq[at]!==i){document.querySelector('#msg').textContent='Wrong! You reached round '+seq.length+'. Start again.';seq=[];return}if(++at===seq.length)setTimeout(next,500)}render();</script></body></html>
