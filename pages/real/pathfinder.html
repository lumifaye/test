<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pathfinding Grid | random stuff zone</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef2ff;font:15px system-ui,sans-serif}header{padding:22px 5vw;background:#0e1526;border-bottom:1px solid #293654}main{max-width:900px;margin:auto;padding:20px}a{color:#c4b5fd}button,input,textarea{font:inherit}button{background:#202d47;color:#eef2ff;border:1px solid #3b4b6b;border-radius:8px;padding:9px 12px;margin:4px;cursor:pointer}button:hover{border-color:#a78bfa}canvas{display:block;background:#080c16;border-radius:12px;margin:14px 0}p{color:#bac5df}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:480px}.tile{aspect-ratio:1;padding:0;margin:0}.life{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;max-width:500px}.life button{margin:0;padding:0;aspect-ratio:1}.maze{display:grid;grid-template-columns:repeat(21,1fr);max-width:500px}.maze i{aspect-ratio:1}.simon{display:grid;grid-template-columns:repeat(2,110px);gap:8px}.simon button{height:100px}.big{font-size:24px;padding:20px}textarea{width:100%;min-height:80px;background:#111a2c;color:white;border:1px solid #3b4b6b;border-radius:8px;padding:12px}
</style></head><body><header><a href="../index.html">← back home</a> · <a href="../pages/mega-lab.html">experiment list</a><h1>Pathfinding Grid</h1><p>Place walls, then find a route from green to red.</p></header><main><div id="app"></div></main><script>let walls=new Set(),path=new Set(),start=0,goal=399;function render(){app.innerHTML='<p>Click tiles to toggle walls. BFS finds a shortest route.</p><button onclick="walls.clear();path.clear();render()">Clear</button> <button onclick="solve()">Find path</button><div class="life">'+Array.from({length:400},(_,i)=>'<button style="background:'+(i===start?'#22c55e':i===goal?'#ef4444':path.has(i)?'#facc15':walls.has(i)?'#64748b':'#172239')+'" onclick="walls.has('+i+')?walls.delete('+i+'):walls.add('+i+');path.clear();render()"></button>').join('')+'</div>'}function solve(){let q=[start],prev=new Map([[start,-1]]);while(q.length){let i=q.shift();if(i===goal)break;for(let j of [i-20,i+20,i%20?i-1:-1,i%20<19?i+1:-1])if(j>=0&&j<400&&!walls.has(j)&&!prev.has(j)){prev.set(j,i);q.push(j)}}path.clear();if(prev.has(goal)){for(let i=goal;i!==-1;i=prev.get(i))path.add(i)}render()}render();</script></body></html>
