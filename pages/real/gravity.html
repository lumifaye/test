<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gravity Sandbox | random stuff zone</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef2ff;font:15px system-ui,sans-serif}header{padding:22px 5vw;background:#0e1526;border-bottom:1px solid #293654}main{max-width:900px;margin:auto;padding:20px}a{color:#c4b5fd}button,input,textarea{font:inherit}button{background:#202d47;color:#eef2ff;border:1px solid #3b4b6b;border-radius:8px;padding:9px 12px;margin:4px;cursor:pointer}button:hover{border-color:#a78bfa}canvas{display:block;background:#080c16;border-radius:12px;margin:14px 0}p{color:#bac5df}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:480px}.tile{aspect-ratio:1;padding:0;margin:0}.life{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;max-width:500px}.life button{margin:0;padding:0;aspect-ratio:1}.maze{display:grid;grid-template-columns:repeat(21,1fr);max-width:500px}.maze i{aspect-ratio:1}.simon{display:grid;grid-template-columns:repeat(2,110px);gap:8px}.simon button{height:100px}.big{font-size:24px;padding:20px}textarea{width:100%;min-height:80px;background:#111a2c;color:white;border:1px solid #3b4b6b;border-radius:8px;padding:12px}
</style></head><body><header><a href="../index.html">← back home</a> · <a href="../pages/mega-lab.html">experiment list</a><h1>Gravity Sandbox</h1><p>Spawn balls and toggle the direction of gravity.</p></header><main><div id="app"></div></main><script>let balls=[],down=false,flip=1;function render(){app.innerHTML='<button onclick="flip*=-1">Flip gravity</button> <button onclick="balls=[]">Clear</button><canvas id="sim" width="600" height="400" style="width:100%;touch-action:none"></canvas>';let c=document.querySelector('canvas'),x=c.getContext('2d');c.onpointerdown=e=>{let r=c.getBoundingClientRect();balls.push({x:(e.clientX-r.left)/r.width*600,y:(e.clientY-r.top)/r.height*400,vx:Math.random()*4-2,vy:0,r:5+Math.random()*10,color='hsl('+Math.random()*360+' 80% 60%)'})};function frame(){x.fillStyle='#080c16';x.fillRect(0,0,600,400);for(let b of balls){b.vy+=.15*flip;b.x+=b.vx;b.y+=b.vy;if(b.x<b.r||b.x>600-b.r)b.vx*=-.9;if(b.y>400-b.r){b.y=400-b.r;b.vy*=-.8}if(b.y<b.r){b.y=b.r;b.vy*=-.8}x.fillStyle=b.color;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()}requestAnimationFrame(frame)}frame()}render();</script></body></html>
