<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minesweeper | random stuff zone</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef2ff;font:15px system-ui,sans-serif}header{padding:22px 5vw;background:#0e1526;border-bottom:1px solid #293654}main{max-width:900px;margin:auto;padding:20px}a{color:#c4b5fd}button,input,textarea{font:inherit}button{background:#202d47;color:#eef2ff;border:1px solid #3b4b6b;border-radius:8px;padding:9px 12px;margin:4px;cursor:pointer}button:hover{border-color:#a78bfa}canvas{display:block;background:#080c16;border-radius:12px;margin:14px 0}p{color:#bac5df}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:480px}.tile{aspect-ratio:1;padding:0;margin:0}.life{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;max-width:500px}.life button{margin:0;padding:0;aspect-ratio:1}.maze{display:grid;grid-template-columns:repeat(21,1fr);max-width:500px}.maze i{aspect-ratio:1}.simon{display:grid;grid-template-columns:repeat(2,110px);gap:8px}.simon button{height:100px}.big{font-size:24px;padding:20px}textarea{width:100%;min-height:80px;background:#111a2c;color:white;border:1px solid #3b4b6b;border-radius:8px;padding:12px}
</style></head><body><header><a href="../index.html">← back home</a> · <a href="../pages/mega-lab.html">experiment list</a><h1>Minesweeper</h1><p>Reveal safe tiles without hitting a mine.</p></header><main><div id="app"></div></main><script>const N=10,M=12;let open=new Set(),flags=new Set(),mines=new Set();function init(){open.clear();flags.clear();mines.clear();while(mines.size<M)mines.add(Math.floor(Math.random()*N*N));render()}function near(i){let x=i%N,y=i/N|0,a=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let X=x+dx,Y=y+dy;if(X>=0&&X<N&&Y>=0&&Y<N&& (dx||dy))a.push(Y*N+X)}return a}function render(){app.innerHTML='<button onclick="init()">New board</button><p>Right-click to flag.</p><div class="grid">'+Array.from({length:N*N},(_,i)=>'<button class="tile" oncontextmenu="event.preventDefault();flags.has('+i+')?flags.delete('+i+'):flags.add('+i+');render()" onclick="openTile('+i+')">'+(flags.has(i)?'⚑':open.has(i)?(mines.has(i)?'💣':near('+i+').filter(j=>mines.has(j)).length||''):'')+'</button>').join('')+'</div>'}function openTile(i){if(flags.has(i))return;open.add(i);if(mines.has(i)){app.insertAdjacentHTML('afterbegin','<h2>Boom. New board?</h2>');open=new Set([...open,...mines]);}render()};init();</script></body></html>
