<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tower Defense Mini | random stuff zone</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef2ff;font:15px system-ui,sans-serif}header{padding:22px 5vw;background:#0e1526;border-bottom:1px solid #293654}main{max-width:900px;margin:auto;padding:20px}a{color:#c4b5fd}button,input,textarea{font:inherit}button{background:#202d47;color:#eef2ff;border:1px solid #3b4b6b;border-radius:8px;padding:9px 12px;margin:4px;cursor:pointer}button:hover{border-color:#a78bfa}canvas{display:block;background:#080c16;border-radius:12px;margin:14px 0}p{color:#bac5df}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:480px}.tile{aspect-ratio:1;padding:0;margin:0}.life{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;max-width:500px}.life button{margin:0;padding:0;aspect-ratio:1}.maze{display:grid;grid-template-columns:repeat(21,1fr);max-width:500px}.maze i{aspect-ratio:1}.simon{display:grid;grid-template-columns:repeat(2,110px);gap:8px}.simon button{height:100px}.big{font-size:24px;padding:20px}textarea{width:100%;min-height:80px;background:#111a2c;color:white;border:1px solid #3b4b6b;border-radius:8px;padding:12px}
</style></head><body><header><a href="../index.html">← back home</a> · <a href="../pages/mega-lab.html">experiment list</a><h1>Tower Defense Mini</h1><p>Place towers and stop the squares reaching the end.</p></header><main><div id="app"></div></main><script>let towers=[],enemies=[],cash=100,wave=1;function render(){app.innerHTML='<p>Cash: '+cash+' · Wave: '+wave+'</p><button onclick="spawn()">Start wave</button><button onclick="towers=[];cash=100;enemies=[];wave=1;render()">Reset</button><canvas width="600" height="300" style="width:100%"></canvas><p>Click the field to place a tower (25 coins).</p>';let c=document.querySelector('canvas'),x=c.getContext('2d');c.onclick=e=>{if(cash>=25){towers.push({x:e.offsetX/c.clientWidth*600,y:e.offsetY/c.clientHeight*300});cash-=25;render()}};let path=Array.from({length:11},(_,i)=>({x:i*60,y:150+Math.sin(i)*60}));function frame(){x.fillStyle='#0c1b1a';x.fillRect(0,0,600,300);x.strokeStyle='#64748b';x.lineWidth=24;x.beginPath();path.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();for(let t of towers){x.fillStyle='#60a5fa';x.beginPath();x.arc(t.x,t.y,12,0,7);x.fill()}enemies.forEach(e=>{e.p+=.001*wave;let n=Math.min(9,e.p*10|0),f=e.p*10-n,p=path[n],q=path[Math.min(10,n+1)];e.x=p.x+(q.x-p.x)*f;e.y=p.y+(q.y-p.y)*f;x.fillStyle='#ef4444';x.fillRect(e.x-7,e.y-7,14,14);for(let t of towers)if(Math.hypot(t.x-e.x,t.y-e.y)<75)e.hp-=.015});enemies=enemies.filter(e=>e.hp>0&&e.p<1);if(enemies.length)requestAnimationFrame(frame)}frame()}function spawn(){for(let i=0;i<8+wave*2;i++)setTimeout(()=>enemies.push({p:0,hp:1+wave*.3,x:0,y:150}),i*500);wave++;render()}render();</script></body></html>
