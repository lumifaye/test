<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conway's Game of Life | random stuff zone</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef2ff;font:15px system-ui,sans-serif}header{padding:22px 5vw;background:#0e1526;border-bottom:1px solid #293654}main{max-width:900px;margin:auto;padding:20px}a{color:#c4b5fd}button,input,textarea{font:inherit}button{background:#202d47;color:#eef2ff;border:1px solid #3b4b6b;border-radius:8px;padding:9px 12px;margin:4px;cursor:pointer}button:hover{border-color:#a78bfa}canvas{display:block;background:#080c16;border-radius:12px;margin:14px 0}p{color:#bac5df}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:480px}.tile{aspect-ratio:1;padding:0;margin:0}.life{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;max-width:500px}.life button{margin:0;padding:0;aspect-ratio:1}.maze{display:grid;grid-template-columns:repeat(21,1fr);max-width:500px}.maze i{aspect-ratio:1}.simon{display:grid;grid-template-columns:repeat(2,110px);gap:8px}.simon button{height:100px}.big{font-size:24px;padding:20px}textarea{width:100%;min-height:80px;background:#111a2c;color:white;border:1px solid #3b4b6b;border-radius:8px;padding:12px}
</style></head><body><header><a href="../index.html">← back home</a> · <a href="../pages/mega-lab.html">experiment list</a><h1>Conway's Game of Life</h1><p>Draw cells and watch them evolve.</p></header><main><div id="app"></div></main><script>let cells=new Set(),run=false,timer;function draw(){app.innerHTML='<button onclick="step()">Step</button> <button onclick="toggle()">'+(run?'Pause':'Run')+'</button> <button onclick="cells.clear();draw()">Clear</button><div class="life">'+Array.from({length:400},(_,i)=>'<button style="background:'+(cells.has(i)?'#a78bfa':'#172239')+'" onclick="toggleCell('+i+')"></button>').join('')+'</div>'}function toggleCell(i){cells.has(i)?cells.delete(i):cells.add(i);draw()}function step(){let next=new Set();for(let y=0;y<20;y++)for(let x=0;x<20;x++){let i=y*20+x,n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy){let xx=x+dx,yy=y+dy;if(xx>=0&&xx<20&&yy>=0&&yy<20&&cells.has(yy*20+xx))n++}if(n===3||(cells.has(i)&&n===2))next.add(i)}cells=next;draw()}function toggle(){run=!run;if(run)loop()}function loop(){if(!run)return;step();timer=setTimeout(loop,160)}draw();</script></body></html>
