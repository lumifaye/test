<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>infinite-ish terrain</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf0ff;font:15px system-ui,sans-serif}header{padding:20px clamp(14px,4vw,40px);display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid #26304a;background:#0d1323}a{color:#aab8ff}h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:-.05em}p{color:#9eacce;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:20px;display:grid;gap:16px}.panel{background:#11192a;border:1px solid #283652;border-radius:16px;padding:16px}canvas{display:block;width:100%;height:auto;background:#070b14;border-radius:10px;touch-action:none}button,select,input{background:#202b44;color:#eff3ff;border:1px solid #405173;border-radius:9px;padding:9px 12px;font:inherit}button{cursor:pointer}button:hover{background:#334366}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note{font-size:13px;color:#8fa0c3}.big{font-size:24px;font-weight:700}#game{width:100%;max-height:68vh;object-fit:contain}</style></head><body><header><div><h1>infinite-ish terrain</h1><p>generate a weird little landscape</p></div><a href="../index.html">← all the stuff</a></header><main><section class='panel'><canvas id='c' width='760' height='460'></canvas><div class='row'><button id='new'>new terrain</button><label>roughness <input id='rough' type='range' min='1' max='10' value='5'></label></div></section></main><script>const c=document.querySelector('#c'),x=c.getContext('2d');function draw(){x.fillStyle='#92d8ed';x.fillRect(0,0,760,460);let y=210,pts=[];for(let a=0;a<=760;a+=5){y+=(Math.random()-.5)*Number(document.querySelector('#rough').value)*5;y=Math.max(80,Math.min(380,y));pts.push([a,y])}x.beginPath();x.moveTo(0,460);pts.forEach(p=>x.lineTo(...p));x.lineTo(760,460);x.fillStyle='#3a7154';x.fill();x.beginPath();pts.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.strokeStyle='#c3e5a1';x.lineWidth=3;x.stroke();}document.querySelector('#new').onclick=draw;document.querySelector('#rough').oninput=draw;draw();</script></body></html>
